server:
  port: 8080

spring:
  application:
    name: insurance-service
  datasource:
    url: jdbc:postgresql://db-insurance-service:5432/insurance_service
    username: db_user
    password: insuranceservice123
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  security:
    jwt:
      jwk-set-uri: ${APP_SECURITY_JWT_JWK_SET_URI:http://localhost:8082/realms/insurance/protocol/openid-connect/certs}
      issuer-uri: ${APP_SECURITY_JWT_ISSUER_URI:http://localhost:8082/realms/insurance}
  registry:
    base-url: ${APP_REGISTRY_BASE_URL:http://localhost:8081}
    api-key: ${APP_REGISTRY_API_KEY:registry-local-key}